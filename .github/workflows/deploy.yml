name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Endereço público do recetor dos formulários (não é segredo): Worker da Cloudflare ou,
          # para reversão, URL /exec do Google Apps Script. Settings → Secrets and variables →
          # Actions → Variables. Procedimento: docs/PUBLICACAO.md.
          VITE_FORMS_ENDPOINT: ${{ vars.VITE_FORMS_ENDPOINT }}
          # Recetor ativo: "google" (omissão) ou "cloudflare" (workers/forms). Só um em produção.
          VITE_FORMS_PROVIDER: ${{ vars.VITE_FORMS_PROVIDER }}
          # Chave PÚBLICA do widget Turnstile (o segredo fica só no Worker).
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
