<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#070D2B" />
    <link rel="icon" type="image/svg+xml" href="/brand/finer-one-icon.svg" />
    <title>Página não encontrada | Finer One</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #070D2B; color: #fff; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 560px; }
      .linha { width: 56px; height: 2px; background: #0052FF; box-shadow: 0 0 16px #1E90FF; margin-bottom: 28px; }
      h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 16px; }
      p { color: rgba(255,255,255,0.72); font-size: 17px; line-height: 1.6; margin: 0 0 28px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; }
      a { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px;
        font-weight: 600; font-size: 15px; text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,0.25); }
      a.principal { background: #0052FF; border-color: #0052FF; }
      a:focus-visible { outline: 2px solid #1E90FF; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="linha" aria-hidden="true"></div>
      <h1>Esta página não existe.</h1>
      <p>O endereço pode ter mudado ou estar incorreto. Continue a partir de uma destas páginas.</p>
      <nav aria-label="Páginas principais">
        <a class="principal" href="/">Página inicial</a>
        <a href="/sobre/">Sobre nós</a>
        <a href="/lista-espera/">Lista de espera</a>
        <a href="/pioneers/">Finer Pioneers</a>
      </nav>
    </main>
  </body>
</html>
